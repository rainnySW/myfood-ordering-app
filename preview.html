<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview: Ramen Aroy | Cozy Ordering</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Quicksand', 'sans-serif'] },
                    colors: {
                        warmBg: '#FAF7F2', cardLight: '#FFFFFF', textDark: '#4A3B32',
                        pastelOrange: '#FFDDBF', pastelOrangeHover: '#FFC899', pastelGreen: '#D5ECC2',
                        warmDarkBg: '#2A2421', cardDark: '#38302C', textLight: '#F5EFE6', darkAccent: '#D97736',
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(74, 59, 50, 0.08)',
                        'softDark': '0 10px 40px -10px rgba(0, 0, 0, 0.3)',
                    }
                }
            }
        }
    </script>
    <style>
        body { transition: background-color 0.5s ease, color 0.5s ease; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #FFDDBF; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #D97736; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-warmBg text-textDark dark:bg-warmDarkBg dark:text-textLight antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const MOCK_MENU = [
            { _id: 'm1', name: 'Tonkotsu Ramen', price: 169, category: 'Ramen', image_url: 'https://placehold.co/400x300/FFDDBF/4A3B32?text=🍜+Tonkotsu', description: 'Rich pork broth with chashu & soft egg.' },
            { _id: 'm2', name: 'Shoyu Ramen', price: 159, category: 'Ramen', image_url: 'https://placehold.co/400x300/FFC899/4A3B32?text=🍲+Shoyu', description: 'Classic soy sauce broth, light and comfy.' },
            { _id: 'm3', name: 'Spicy Miso Ramen', price: 189, category: 'Ramen', image_url: 'https://placehold.co/400x300/FFAAA5/4A3B32?text=🌶️+Spicy+Miso', description: 'Warm your soul with spicy miso broth.' },
            { _id: 'a1', name: 'Crispy Gyoza', price: 89, category: 'Sides', image_url: 'https://placehold.co/400x300/D5ECC2/4A3B32?text=🥟+Gyoza', description: '5 pcs of pan-fried pork dumplings.' },
            { _id: 'd1', name: 'Iced Matcha', price: 65, category: 'Drinks', image_url: 'https://placehold.co/400x300/C8E6C9/4A3B32?text=🍵+Matcha', description: 'Premium Uji matcha.' }
        ];

        function App() {
            const [isDark, setIsDark] = useState(false);
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [checkoutStep, setCheckoutStep] = useState('cart'); 
            const [tableNumber, setTableNumber] = useState('');
            const [menuItems, setMenuItems] = useState(MOCK_MENU);
            const [isUserPanelOpen, setIsUserPanelOpen] = useState(false);
            const [lastOrder, setLastOrder] = useState(null);

            useEffect(() => {
                if (isDark) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            }, [isDark]);

            const addToCart = (item) => {
                setCart(prev => {
                    const existing = prev.find(i => i._id === item._id);
                    if (existing) return prev.map(i => i._id === item._id ? { ...i, qty: i.qty + 1 } : i);
                    return [...prev, { ...item, qty: 1 }];
                });
                setIsCartOpen(true);
            };

            const updateQty = (id, delta) => {
                setCart(prev => prev.map(i => {
                    if (i._id === id) {
                        const newQty = i.qty + delta;
                        return newQty > 0 ? { ...i, qty: newQty } : i;
                    }
                    return i;
                }).filter(i => i.qty > 0));
            };

            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const cartCount = cart.reduce((sum, item) => sum + item.qty, 0);

            const handleCheckoutSubmit = (e) => {
                e.preventDefault();
                if (!tableNumber) return;
                
                setLastOrder({
                    id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                    items: [...cart],
                    total: cartTotal,
                    table: tableNumber,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                });
                
                setCheckoutStep('success');
                setTimeout(() => {
                    setCheckoutStep('receipt');
                    setCart([]);
                    setTableNumber('');
                }, 2000);
            };

            const handleCloseReceipt = () => {
                setIsCartOpen(false);
                setTimeout(() => { setCheckoutStep('cart'); setLastOrder(null); }, 300);
            };

            return (
                <div className="min-h-screen relative pb-24 md:pb-0">
                    <nav className="sticky top-0 z-40 backdrop-blur-md bg-warmBg/80 dark:bg-warmDarkBg/80 border-b border-pastelOrange/20 dark:border-white/5">
                        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <i className="ph-fill ph-bowl-food text-3xl text-[#D97736] dark:text-pastelOrange"></i>
                                <span className="text-xl font-bold">Ramen Aroy (Preview Mode)</span>
                            </div>
                            <div className="flex items-center gap-4">
                                <button onClick={() => setIsDark(!isDark)} className="p-2 rounded-full hover:bg-pastelOrange/20 transition-colors">
                                    {isDark ? <i className="ph-fill ph-sun text-xl text-pastelOrange"></i> : <i className="ph-fill ph-moon text-xl text-textDark"></i>}
                                </button>
                                <button onClick={() => setIsCartOpen(true)} className="hidden md:flex items-center gap-2 bg-pastelOrange dark:bg-darkAccent text-textDark dark:text-textLight px-4 py-2 rounded-full font-semibold hover:opacity-90 transition-all shadow-sm active:scale-95">
                                    <i className="ph-bold ph-shopping-bag text-lg"></i>
                                    <span>{cartCount} Items</span>
                                </button>
                            </div>
                        </div>
                    </nav>

                    <header className="max-w-6xl mx-auto px-4 py-12 md:py-20 text-center">
                        <h1 className="text-4xl md:text-6xl font-bold mb-4">Warm bowls for <br className="md:hidden" />
                            <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#D97736] to-orange-400 dark:from-pastelOrange dark:to-[#FFDDBF]">cozy moments.</span>
                        </h1>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 pb-20">
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
                            {menuItems.map(item => (
                                <div key={item._id} className="group bg-cardLight dark:bg-cardDark rounded-3xl overflow-hidden shadow-soft dark:shadow-softDark hover:-translate-y-1 transition-all">
                                    <div className="relative h-48 overflow-hidden">
                                        <img src={item.image_url} alt={item.name} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                                        <div className="absolute top-4 right-4 bg-white/90 dark:bg-black/50 px-3 py-1 rounded-full text-sm font-bold">฿{item.price}</div>
                                    </div>
                                    <div className="p-6">
                                        <div className="text-xs font-bold uppercase tracking-wider text-[#D97736] dark:text-pastelOrange mb-1">{item.category}</div>
                                        <h3 className="text-xl font-bold mb-2">{item.name}</h3>
                                        <p className="opacity-70 text-sm mb-4 line-clamp-2">{item.description}</p>
                                        <button onClick={() => addToCart(item)} className="w-full py-3 rounded-2xl bg-warmBg dark:bg-warmDarkBg border-2 border-pastelOrange dark:border-darkAccent font-semibold flex items-center justify-center gap-2 hover:bg-pastelOrange dark:hover:bg-darkAccent hover:text-textDark dark:hover:text-textLight transition-colors">
                                            <i className="ph-bold ph-plus"></i> Add to Order
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    <div className="md:hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-30 w-[90%] max-w-sm">
                        <button onClick={() => setIsCartOpen(true)} className="w-full bg-pastelOrange dark:bg-darkAccent text-textDark dark:text-textLight px-6 py-4 rounded-3xl font-bold text-lg shadow-lg flex items-center justify-between">
                            <span className="flex items-center gap-2"><i className="ph-fill ph-shopping-cart text-2xl"></i> View Order ({cartCount})</span>
                            <span>฿{cartTotal}</span>
                        </button>
                    </div>

                    <div className={`fixed inset-0 bg-textDark/20 dark:bg-black/60 backdrop-blur-sm z-50 transition-opacity duration-300 ${isCartOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                        <div className={`absolute bottom-0 md:top-0 md:bottom-auto md:right-0 w-full md:w-[450px] h-[85vh] md:h-screen bg-cardLight dark:bg-cardDark md:rounded-l-3xl rounded-t-3xl md:rounded-tr-none shadow-2xl flex flex-col transition-transform duration-500 ease-out ${isCartOpen ? 'translate-y-0 md:translate-x-0' : 'translate-y-full md:translate-y-0 md:translate-x-full'}`}>
                            
                            <div className="flex items-center justify-between p-6 border-b border-warmBg dark:border-white/5">
                                <h2 className="text-2xl font-bold">{checkoutStep === 'cart' ? 'Your Order' : checkoutStep === 'checkout' ? 'Checkout' : checkoutStep === 'receipt' ? 'Digital Receipt' : ''}</h2>
                                <button onClick={() => { setIsCartOpen(false); setTimeout(() => setCheckoutStep('cart'), 300); }} className="p-2 bg-warmBg dark:bg-warmDarkBg rounded-full hover:scale-110 transition-transform">
                                    <i className="ph-bold ph-x text-xl"></i>
                                </button>
                            </div>

                            <div className="flex-1 overflow-y-auto p-6">
                                {cart.length === 0 && checkoutStep === 'cart' ? (
                                    <div className="h-full flex flex-col items-center justify-center opacity-50 space-y-4">
                                        <i className="ph-thin ph-shopping-bag text-6xl"></i>
                                        <p>Your comfy cart is empty.</p>
                                    </div>
                                ) : checkoutStep === 'cart' ? (
                                    <div className="space-y-6">
                                        {cart.map(item => (
                                            <div key={item._id} className="flex gap-4">
                                                <img src={item.image_url} alt={item.name} className="w-20 h-20 rounded-xl object-cover" />
                                                <div className="flex-1">
                                                    <h4 className="font-bold">{item.name}</h4>
                                                    <p className="text-[#D97736] dark:text-pastelOrange font-semibold">฿{item.price}</p>
                                                    <div className="flex items-center gap-3 mt-2 bg-warmBg dark:bg-warmDarkBg w-fit rounded-full px-2 py-1">
                                                        <button onClick={() => updateQty(item._id, -1)} className="w-6 h-6 flex items-center justify-center rounded-full"><i className="ph-bold ph-minus"></i></button>
                                                        <span className="font-bold text-sm w-4 text-center">{item.qty}</span>
                                                        <button onClick={() => updateQty(item._id, 1)} className="w-6 h-6 flex items-center justify-center rounded-full"><i className="ph-bold ph-plus"></i></button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : checkoutStep === 'checkout' ? (
                                    <form id="checkout-form" onSubmit={handleCheckoutSubmit} className="space-y-6">
                                        <div>
                                            <label className="block text-sm font-bold mb-2 opacity-80">Enter Your Table Number <span className="text-red-500">*</span></label>
                                            <input type="number" required value={tableNumber} onChange={(e) => setTableNumber(e.target.value)} placeholder="e.g. 12" className="w-full bg-warmBg dark:bg-warmDarkBg px-4 py-3 rounded-xl outline-none" />
                                        </div>
                                        <div className="p-4 bg-pastelOrange/20 rounded-2xl text-center">
                                            <p className="text-sm font-semibold mb-2">Payment Transfer</p>
                                            <div className="aspect-square w-32 mx-auto bg-white rounded-xl flex items-center justify-center shadow-sm">
                                                <i className="ph-thin ph-qr-code text-6xl text-textDark"></i>
                                            </div>
                                            <p className="text-xs mt-2 opacity-70">Scan to pay ฿{cartTotal}</p>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold mb-2 opacity-80">Upload Payment Slip <span className="text-red-500">*</span></label>
                                            <input type="file" accept="image/*" required className="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-pastelOrange file:text-textDark hover:file:bg-[#FFC899]" />
                                        </div>
                                    </form>
                                ) : checkoutStep === 'success' ? (
                                    <div className="h-full flex flex-col items-center justify-center text-center space-y-4">
                                        <div className="w-20 h-20 bg-pastelGreen text-[#4A3B32] rounded-full flex items-center justify-center mb-4">
                                            <i className="ph-bold ph-check text-4xl"></i>
                                        </div>
                                        <h3 className="text-2xl font-bold">Order Received!</h3>
                                    </div>
                                ) : checkoutStep === 'receipt' && lastOrder ? (
                                    <div className="h-full flex flex-col items-center py-4">
                                        <div className="w-full bg-white dark:bg-cardLight/10 rounded-xl border-t-4 border-dashed border-pastelOrange p-6 shadow-sm relative">
                                            <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-cardLight dark:bg-cardDark px-4 text-xs font-bold uppercase opacity-50 rounded-full">Receipt</div>
                                            <div className="text-center mb-6 mt-2">
                                                <h3 className="text-xl font-bold">Ramen Aroy</h3>
                                                <p className="text-sm opacity-70">Order #{lastOrder.id}</p>
                                                <p className="text-sm opacity-70">Table {lastOrder.table}</p>
                                            </div>
                                            <div className="space-y-3 mb-6 border-t border-b border-gray-100 dark:border-white/10 py-4">
                                                {lastOrder.items.map(item => (
                                                    <div key={item._id} className="flex justify-between text-sm">
                                                        <span>{item.qty}x {item.name}</span>
                                                        <span>฿{item.price * item.qty}</span>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="flex justify-between items-center font-bold text-lg">
                                                <span>Total Paid</span>
                                                <span className="text-[#D97736] dark:text-pastelOrange">฿{lastOrder.total}</span>
                                            </div>
                                        </div>
                                        <button onClick={handleCloseReceipt} className="mt-6 w-full py-4 rounded-2xl bg-textDark dark:bg-textLight text-white dark:text-textDark font-bold text-lg">Done</button>
                                    </div>
                                ) : null}
                            </div>

                            {cart.length > 0 && checkoutStep !== 'success' && checkoutStep !== 'receipt' && (
                                <div className="p-6 border-t border-warmBg dark:border-white/5 bg-cardLight dark:bg-cardDark">
                                    <div className="flex justify-between items-center mb-4 text-lg">
                                        <span className="opacity-70 font-semibold">Total</span>
                                        <span className="text-2xl font-bold">฿{cartTotal}</span>
                                    </div>
                                    {checkoutStep === 'cart' ? (
                                        <button onClick={() => setCheckoutStep('checkout')} className="w-full bg-textDark dark:bg-textLight text-white dark:text-textDark py-4 rounded-2xl font-bold text-lg">Proceed to Checkout</button>
                                    ) : (
                                        <div className="flex gap-3">
                                            <button onClick={() => setCheckoutStep('cart')} className="w-1/3 bg-warmBg dark:bg-warmDarkBg py-4 rounded-2xl font-bold">Back</button>
                                            <button type="submit" form="checkout-form" className="w-2/3 bg-pastelOrange dark:bg-darkAccent text-textDark dark:text-textLight py-4 rounded-2xl font-bold text-lg"><i className="ph-bold ph-check-circle"></i> Confirm Order</button>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
